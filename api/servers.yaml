# =============================================================================
# SERVIDORES Y FUENTES DE ESTADO
# -----------------------------------------------------------------------------
# La clave de cada servidor (el "slug") debe ser IGUAL que el nombre del fichero
# de su ficha en la web:  web/src/content/servidores/<slug>.md
#
# sources: de dónde se saca el estado, por orden de prioridad.
#   - pterodactyl : estado del proceso (encendido/apagado). Opción: server_id
#   - ark_rcon    : jugadores y versión desde el juego (preparada, sin implementar)
#   - mock        : datos de prueba de mock/status.yaml
#
# maintenance: true  -> la web muestra "Mantenimiento" sin consultar nada.
#
# Aquí NO van contraseñas ni claves: esas van en .env
#
# server_id: identificador corto de cada servidor en el panel de Pterodactyl.
# =============================================================================

servers:
  # [ESP] PVE X10 ARK AVENGERS - GENESIS 1
  genesis-1:
    sources:
